---
- name: Build Ubuntu 24.04 Cloud-Init VM Template
  hosts: proxmox
  become: true
  vars:
    template_id: 9000
    template_name: "ubuntu-2404-cloudinit"
    storage_pool: "local-lvm"
    image_url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
    image_path: "/tmp/noble-server-cloudimg-amd64.img"
    ci_user: "ansible"

  tasks:
    - name: Ensure libguestfs-tools is installed for image customization
      ansible.builtin.apt:
        name: libguestfs-tools
        state: present
        update_cache: true

    - name: Check if template VM already exists
      ansible.builtin.command: "qm status {{ template_id }}"
      register: vm_status
      failed_when: false
      changed_when: false

    - name: Download Ubuntu Cloud Image
      ansible.builtin.get_url:
        url: "{{ image_url }}"
        dest: "{{ image_path }}"
        mode: "0644"
      when: vm_status.rc != 0

    - name: Install qemu-guest-agent inside the cloud image
      ansible.builtin.command: "virt-customize -a {{ image_path }} --install qemu-guest-agent"
      when: vm_status.rc != 0
      changed_when: true

    - name: Create and configure Proxmox VM template
      ansible.builtin.shell: |
        qm create {{ template_id }} --name {{ template_name }} --memory 2048 --cores 2 --net0 virtio,bridge=vmbr0
        qm importdisk {{ template_id }} {{ image_path }} {{ storage_pool }}
        qm set {{ template_id }} --scsihw virtio-scsi-pci --scsi0 {{ storage_pool }}:vm-{{ template_id }}-disk-0
        qm set {{ template_id }} --boot c --bootdisk scsi0
        qm set {{ template_id }} --ide2 {{ storage_pool }}:cloudinit
        qm set {{ template_id }} --serial0 socket --vga serial0
        qm set {{ template_id }} --agent enabled=1
        qm set {{ template_id }} --ciuser {{ ci_user }} --sshkeys /root/.ssh/authorized_keys
        qm template {{ template_id }}
      when: vm_status.rc != 0
      changed_when: true

    - name: Clean up downloaded cloud image
      ansible.builtin.file:
        path: "{{ image_path }}"
        state: absent
        